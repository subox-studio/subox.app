<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subox</title>
<script>
  // GitHub Pages serves static files only, so there's no real page at clean
  // URLs like /subox.app/login or /subox.app/signup — GitHub Pages falls
  // back to this 404.html for any path it can't find. We remember exactly
  // what was requested, then hand off to index.html, which restores that
  // same clean URL in the address bar (via the History API) once it has
  // loaded, so the person still sees /subox.app/login rather than
  // /subox.app/index.html.
  sessionStorage.setItem("subox_entry_path", location.pathname + location.search + location.hash);
  location.replace("/subox.app/index.html" + location.search + location.hash);
</script>
</head>
<body>
  <!-- Fallback for the rare case JavaScript is disabled. -->
  <noscript>
    <p style="font-family:sans-serif;text-align:center;margin-top:60px;">
      <a href="/subox.app/index.html">Subox を開く</a>
    </p>
  </noscript>
</body>
</html>
